<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Bistro Island · Admin</title>
<link rel="stylesheet" href="css/admin.css"></head>
<body>
<header><h1>🏝️ Bistro Island <small>admin</small></h1><select id="days"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="30">30 days</option><option value="90">90 days</option></select><button id="out" hidden>Sign out</button></header>
<form id="login" hidden><p>Sign in with the game account that is listed as an admin.</p><input id="email" type="email" placeholder="Email" autocomplete="username" required><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button>Sign in</button><p id="msg"></p></form>
<main id="dash" hidden></main>
<script type="module" src="js/admin.js"></script>
</body></html>
