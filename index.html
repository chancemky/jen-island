<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff4de">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JEN Island">
<meta name="description" content="A cozy Vietnamese island business-life game.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap&subset=vietnamese">
<link rel="stylesheet" href="css/game.css">
<title>JEN Island</title>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="JEN Island"></canvas>

  <!-- touch layer for the floating joystick -->
  <div id="touch"><div id="joyBase"><div id="joyKnob"></div></div><div id="joyHint" data-t="joyhint"></div></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button class="chip chip-clock" id="clockChip" type="button"><span class="sun" id="sunIcon"></span><span><b id="dayLabel">Ngày 1</b><small id="clockLabel">07:00</small></span></button>
      <div class="chip chip-money" id="moneyChip"><span class="coin"></span><b id="moneyLabel">0k</b></div>
      <button class="chip chip-rep" id="repChip" type="button"><b class="lv" id="lvLabel">Lv 1</b><span class="stars" id="stars"></span><span class="rep-num" id="repNum"></span><i class="xpbar"><i id="xpFill"></i></i></button>
      <button class="pause-btn" id="pauseBtn" type="button" aria-label="Pause"><i></i><i></i></button>
      <button class="round-btn" id="menuBtn" type="button" aria-label="Menu"><span class="burger"></span></button>
    </div>
    <button class="quest" id="questPill" type="button"><span class="quest-dot"></span><span id="questText"></span></button>
    <div class="area" id="areaToast"><b id="areaName"></b><small id="areaEn"></small></div>
  </div>
  <div id="pointer" class="hidden"><div class="pointer-arrow"></div></div>

  <!-- context actions -->
  <div id="actions" class="hidden">
    <button class="act-btn" id="actBtn" type="button"><span class="act-icon" id="actIcon"></span><span class="act-label" id="actLabel">A</span></button>
    <button class="pill-btn open-btn hidden" id="bizBtn" type="button"></button>
    <button class="side-btn" id="bagBtn" type="button" aria-label="Bag"><span class="bag-ico"></span></button>
    <button class="side-btn map-btn" id="mapBtn" type="button" aria-label="Map"><img src="" alt="" id="mapIco"></button>
  </div>

  <!-- dialogue -->
  <div id="dialog" class="hidden">
    <div class="dlg-portrait"><canvas id="portrait" width="220" height="220"></canvas></div>
    <div class="dlg-box">
      <div class="dlg-name" id="dlgName"></div>
      <div class="dlg-text" id="dlgText"></div>
      <div class="dlg-choices" id="dlgChoices"></div>
      <div class="dlg-next" id="dlgNext"></div>
    </div>
  </div>

  <div id="sheets"></div>
  <div id="toasts"></div>
  <div id="fade"></div>
  <div id="cinema" class="hidden"><div class="bar top"></div><div class="bar bottom"></div><button class="skip-btn hidden" id="skipBtn" type="button" data-t="skip"></button><div class="caption" id="caption"></div></div>

  <!-- account screen -->
  <section id="auth" class="screen hidden">
    <canvas id="authBg"></canvas>
    <div class="auth-card card">
      <div class="logo"><span class="logo-jen">JEN</span><span class="logo-island">Island</span></div>
      <p class="tagline" data-t="tagline"></p>
      <div class="seg" id="authTabs"><button type="button" class="on" data-tab="login" data-t="login"></button><button type="button" data-tab="signup" data-t="signup"></button></div>
      <form id="authForm" autocomplete="on" novalidate>
        <label class="field"><span data-t="email"></span><input id="authEmail" type="email" autocomplete="email" inputmode="email" required></label>
        <label class="field"><span data-t="password"></span><input id="authPass" type="password" autocomplete="current-password" minlength="6" required></label>
        <p class="auth-msg" id="authMsg"></p>
        <button class="btn big" id="authSubmit" type="submit" data-t="play"></button>
        <div class="lang-pick" id="langPick"><button type="button" data-lang="en">English</button><button type="button" data-lang="vi">Tiếng Việt</button></div>
      </form>
    </div>
  </section>

  <div id="boot" class="screen"><div class="boot-inner"><div class="boot-cat"></div><div class="boot-bar"><i id="bootBar"></i></div><small id="bootMsg"></small></div></div>
  <div id="rotate"><div class="rotate-card"><div class="rotate-phone"></div><b data-t="rotate"></b><small data-t="rotate2"></small></div></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
