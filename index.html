<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff4de">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bistro Island">
<meta name="description" content="Run little shops on a cozy Vietnamese island. Free to play, in English and Tiếng Việt.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bistro Island">
<meta property="og:title" content="Bistro Island">
<meta property="og:description" content="Run little shops on a cozy Vietnamese island. Free to play, in English and Tiếng Việt.">
<meta property="og:url" content="https://jen-island.jen-simulator.workers.dev/">
<meta property="og:image" content="https://jen-island.jen-simulator.workers.dev/assets/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Mèo Mây waving on a little island beside the Bistro Island logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Bistro Island">
<meta name="twitter:description" content="Run little shops on a cozy Vietnamese island. Free to play, in English and Tiếng Việt.">
<meta name="twitter:image" content="https://jen-island.jen-simulator.workers.dev/assets/share.png">
<link rel="preload" href="assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="css/game.css">
<title>Bistro Island</title>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Bistro Island"></canvas>

  <!-- touch layer for the floating joystick -->
  <div id="touch"><div id="joyBase"><div id="joyKnob"></div></div><div id="joyHint" data-t="joyhint"></div></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button class="chip chip-clock" id="clockChip" type="button"><span class="sun" id="sunIcon"></span><span><b id="dayLabel">Ngày 1</b><small id="clockLabel">07:00</small></span></button>
      <div class="chip chip-money" id="moneyChip"><span class="coin"></span><b id="moneyLabel">0k</b></div>
      <button class="chip chip-rep" id="repChip" type="button"><b class="lv" id="lvLabel">Lv 1</b><span class="stars" id="stars"></span><span class="rep-num" id="repNum"></span><i class="xpbar"><i id="xpFill"></i></i></button>
      <button class="pause-btn" id="pauseBtn" type="button" aria-label="Pause"><i></i><i></i></button>
      <button class="round-btn" id="menuBtn" type="button" aria-label="Menu"><span class="burger"></span></button>
    </div>
    <button class="quest" id="questPill" type="button"><span class="quest-dot"></span><span id="questText"></span></button>
    <div class="area" id="areaToast"><b id="areaName"></b><small id="areaEn"></small></div>
  </div>
  <div id="pointer" class="hidden"><div class="pointer-arrow"></div></div>

  <!-- context actions -->
  <div id="actions" class="hidden">
    <button class="act-btn" id="actBtn" type="button"><span class="act-icon" id="actIcon"></span><span class="act-label" id="actLabel">A</span></button>
    <button class="pill-btn open-btn hidden" id="bizBtn" type="button"></button>
    <button class="side-btn" id="bagBtn" type="button" aria-label="Bag"><span class="bag-ico"></span></button>
    <button class="side-btn map-btn" id="mapBtn" type="button" aria-label="Map"><img src="" alt="" id="mapIco"></button>
  </div>

  <!-- dialogue -->
  <div id="dialog" class="hidden">
    <div class="dlg-portrait"><canvas id="portrait" width="220" height="220"></canvas></div>
    <div class="dlg-box">
      <div class="dlg-name" id="dlgName"></div>
      <div class="dlg-text" id="dlgText"></div>
      <div class="dlg-choices" id="dlgChoices"></div>
      <div class="dlg-next" id="dlgNext"></div>
    </div>
  </div>

  <div id="sheets"></div>
  <div id="toasts"></div>
  <div id="fade"></div>
  <div id="cinema" class="hidden"><div class="bar top"></div><div class="bar bottom"></div><button class="skip-btn hidden" id="skipBtn" type="button" data-t="skip"></button><div class="caption" id="caption"></div></div>

  <!-- account screen -->
  <section id="auth" class="screen hidden">
    <canvas id="authBg"></canvas>
    <div class="auth-card card">
      <div class="logo"><span class="logo-name">Bistro</span><span class="logo-island">Island</span></div>
      <p class="tagline" data-t="tagline"></p>
      <!-- welcome: what the game is, and play straight away -->
      <div id="authLanding">
        <ul class="auth-feats">
          <li><img data-icon="coffee" alt=""><span data-t="feat1"></span></li>
          <li><img data-icon="sofa" alt=""><span data-t="feat2"></span></li>
          <li><img data-icon="lantern" alt=""><span data-t="feat3"></span></li>
          <li><img data-icon="heart" alt=""><span data-t="feat4"></span></li>
        </ul>
        <button class="btn big pink" id="playGuest" type="button" data-t="playfree"></button>
        <button class="btn ghost" id="showLogin" type="button" data-t="haveaccount"></button>
        <p class="auth-note" data-t="guestnote"></p>
      </div>
      <!-- log in / create account -->
      <div id="authFormWrap" hidden>
        <div class="seg" id="authTabs"><button type="button" class="on" data-tab="login" data-t="login"></button><button type="button" data-tab="signup" data-t="signup"></button></div>
        <form id="authForm" autocomplete="on" novalidate>
          <label class="field"><span data-t="email"></span><input id="authEmail" type="email" autocomplete="email" inputmode="email" required></label>
          <label class="field pw-field"><span data-t="password"></span><input id="authPass" type="password" autocomplete="current-password" minlength="8" required><button type="button" class="pw-eye" id="pwEye" data-t-aria="showpw">👁</button></label>
          <p class="auth-msg" id="authMsg"></p>
          <button class="btn big" id="authSubmit" type="submit" data-t="play"></button>
          <button class="link-btn" id="forgotBtn" type="button" data-t="forgot"></button>
          <button class="link-btn" id="authBack" type="button" data-t="back"></button>
        </form>
      </div>
      <!-- a password reset link from email lands here -->
      <form id="authReset" hidden novalidate>
        <p class="auth-note" data-t="newpwnote"></p>
        <label class="field"><span data-t="newpw"></span><input id="resetPass" type="password" autocomplete="new-password" minlength="8" required></label>
        <p class="auth-msg" id="resetMsg"></p>
        <button class="btn big" id="resetSubmit" type="submit" data-t="savepw"></button>
      </form>
      <div class="lang-pick" id="langPick"><button type="button" data-lang="en">English</button><button type="button" data-lang="vi">Tiếng Việt</button></div>
      <p class="auth-legal"><a href="privacy.html" target="_blank" rel="noopener" data-t="privacy"></a> · <a href="terms.html" target="_blank" rel="noopener" data-t="terms"></a></p>
    </div>
  </section>

  <div id="boot" class="screen"><div class="boot-inner"><div class="boot-cat"></div><div class="boot-bar"><i id="bootBar"></i></div><small id="bootMsg"></small></div></div>
  <div id="rotate"><div class="rotate-card"><div class="rotate-phone"></div><b data-t="rotate"></b><small data-t="rotate2"></small></div></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
