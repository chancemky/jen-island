<!doctype html><meta charset=utf-8><body style="margin:0;background:#e9d9b8"><canvas id=c width=1200 height=420></canvas><script type=module>
// The grandmas' carts (ice cream, rice paper salad, sugarcane), open and closed, in both languages.
import { G, setLang } from '../js/systems/state.js';
import { foodCart, sugarcaneCart } from '../js/gfx/props.js';
const c = document.getElementById('c').getContext('2d'); c.lineJoin = 'round'; c.lineCap = 'round';
await document.fonts.load('900 16px Nunito').catch(() => {});
const carts = [['icecream', ['ICE CREAM', 'KEM']], ['banhtrang', ['RICE PAPER SALAD', 'BÁNH TRÁNG TRỘN']], ['sugarcane', ['SUGARCANE', 'NƯỚC MÍA']]];
['en', 'vi'].forEach((lang, li) => { setLang(lang); carts.forEach(([type, label], i) => {
  c.setTransform(3.2, 0, 0, 3.2, (90 + i * 190 + li * 600) , 180); if (type === 'sugarcane') sugarcaneCart(c, 1, { label }); else foodCart(c, 1, { type, label });
}); });
window.done = 1;
</script>
