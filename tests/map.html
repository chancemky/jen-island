<!doctype html><body style="margin:0;background:#5ec2cf"><canvas id=c></canvas><script type=module>
import '../js/systems/state.js';
import { Island, W, H } from '../js/world/island.js';
const Q=new URLSearchParams(location.search), S=+(Q.get('s')||0.4), x0=+(Q.get('x')||0), y0=+(Q.get('y')||0), w=+(Q.get('w')||W), h=+(Q.get('h')||H);
const isl=new Island(); const cv=document.getElementById('c'); cv.width=w*S; cv.height=h*S; const c=cv.getContext('2d');
c.scale(S,S); c.translate(-x0,-y0); c.lineJoin='round'; c.lineCap='round';
const view={x:x0,y:y0,w,h};
isl.drawWater(c,view,1); isl.drawGround(c,view,1,Math.max(0.4,S)); isl.drawShore?.(c,view,1);
const props=[...isl.props].filter(p=>!p.hidden?.()).sort((a,b)=>(a.flat?-1e9:0)+(a.sortY??a.y)-((b.flat?-1e9:0)+(b.sortY??b.y)));
for (const p of props) { c.save(); c.translate(p.x,p.y); try{ p.draw(c,1);}catch(e){} c.restore(); }
window.done=1;
</script>
