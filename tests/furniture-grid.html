<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fbf3e4;font:700 10px sans-serif;color:#5b3f36;display:flex;flex-wrap:wrap;gap:4px;padding:6px}.c{width:118px;text-align:center}canvas{background:#f3e3c8;border-radius:8px;display:block}</style></head><body>
<script type="module">
// Every furniture piece in a grid (art overview): ?ids=… to limit
import { FURN_DRAW } from '../js/gfx/furniture.js';
import { FURNITURE } from '../js/data/game.js';
const ids = (new URLSearchParams(location.search).get('ids') || Object.keys(FURNITURE).join(',')).split(',');
for (const id of ids) {
  const d = document.createElement('div'); d.className = 'c'; const cv = document.createElement('canvas'), S = 2; cv.width = 118 * S; cv.height = 100 * S; cv.style.width = '118px';
  const c = cv.getContext('2d'); c.lineJoin = c.lineCap = 'round'; c.scale(S, S); c.translate(59, 90); FURN_DRAW[id]?.(c, 1.3, { x: 0, y: 0, ...FURNITURE[id] });
  d.append(cv, id + ' · ' + (FURNITURE[id].price || 'gift')); document.body.appendChild(d);
}
window.__ready = true;
</script></body></html>
