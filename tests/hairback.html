<!doctype html><body style="margin:0;background:#a3d68a"><canvas id=c></canvas><script type=module>
import '../js/systems/state.js';
import { drawHuman } from '../js/gfx/character.js';
import { playerLook } from '../js/data/looks.js';
import { HAIRCUTS } from '../js/data/hair.js';
const q=new URLSearchParams(location.search), ids=q.get('ids')?q.get('ids').split(','):Object.keys(HAIRCUTS), Z=+(q.get('z')||3), cols=12;
const yaws=[Math.PI, Math.PI*0.72]; const cv=document.getElementById('c'); cv.width=cols*2*30*Z; cv.height=Math.ceil(ids.length/cols)*52*Z; const c=cv.getContext('2d'); c.lineJoin='round'; c.lineCap='round';
ids.forEach((id,i)=>yaws.forEach((yw,j)=>{ const L=playerLook({hairStyle:id, hair:'#6e4430'}); c.save(); c.setTransform(Z,0,0,Z,(((i%cols)*2+j)*30+15)*Z,(Math.floor(i/cols)*52+48)*Z); drawHuman(c,{look:L,dir:'up',yawOverride:yw,moving:0,seed:1},0.3); c.restore(); }));
c.fillStyle='#000'; c.font='10px sans-serif'; ids.forEach((id,i)=>c.fillText(id,((i%cols)*2*30+2)*Z,(Math.floor(i/cols)*52+8)*Z));
window.done=1;
</script>
