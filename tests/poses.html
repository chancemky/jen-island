<!doctype html><body style="margin:0;background:#f7efdc"><canvas id=c width=1400 height=760></canvas><script type=module>
// Pose sheet: a few looks in every everyday pose, from the front, the side and three-quarter back.
import '../js/systems/state.js';
import { drawHuman } from '../js/gfx/character.js';
import { RESIDENTS, employeeLook, playerLook } from '../js/data/looks.js';
const cv = document.getElementById('c'), c = cv.getContext('2d');
const looks = [playerLook({ hairStyle: 'long' }), RESIDENTS.ong_loc.look, employeeLook(3, 'server')];
const poses = [['walk', { moving: 1, walkPh: 1.3 }], ['sit', { sit: true, seatH: 8 }], ['work', { act: 'work' }], ['talk', { talking: true }], ['eat', { act: 'eat', held: 'bread_split' }], ['hold', { act: 'hold', held: 'teacup' }], ['carry', { act: 'carry', held: 'plate' }], ['wave', { act: 'wave' }]];
const yaws = [0, Math.PI / 2, Math.PI * 3 / 4];
c.font = '700 11px sans-serif'; c.textAlign = 'center';
looks.forEach((L, li) => yaws.forEach((yw, yi) => poses.forEach(([n, pose], pi) => {
  const x = 45 + pi * 172 + yi * 52, y = 110 + li * 240 + (yi % 2) * 0;
  c.setTransform(2.4, 0, 0, 2.4, x, y); c.lineJoin = 'round'; c.lineCap = 'round';
  drawHuman(c, { look: L, dir: 'down', yawOverride: yw, moving: 0, seed: 1, actT: 0.3, ...pose }, 0.3);
  c.setTransform(1, 0, 0, 1, 0, 0); if (yi === 1 && li === 0) { c.fillStyle = '#5b3f36'; c.fillText(n, x, 20); }
})));
window.done = 1;
</script>
