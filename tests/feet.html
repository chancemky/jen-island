<!doctype html><body style="margin:0;background:#a3d68a"><canvas id=c></canvas><script type=module>
import '../js/systems/state.js';
import { drawHuman } from '../js/gfx/character.js';
import { playerLook } from '../js/data/looks.js';
import { CLOTHES, applyOutfit } from '../js/data/wardrobe.js';
const q=new URLSearchParams(location.search);
const ids=(q.get('ids')||'basic_shoes,sandals,slippers,rain_boots,boots,loafers,hightops').split(',');
const dirs=[['down',0],['right',0],['up',0],['down',1],['right',1]];
const Z=+(q.get('z')||9), cw=34, chh=24, cv=document.getElementById('c'); cv.width=dirs.length*cw*Z; cv.height=ids.length*chh*Z; const c=cv.getContext('2d'); c.lineJoin='round'; c.lineCap='round';
ids.forEach((id,r)=>dirs.forEach(([d,mv],k)=>{ const L=applyOutfit(playerLook({hairStyle:'bob'}),{shoes:id, outfit:q.get('o')||'classic'}); c.save(); c.setTransform(Z,0,0,Z,0,0); c.beginPath(); c.rect(k*cw,r*chh,cw,chh); c.clip(); c.translate(k*cw+17,r*chh+18); drawHuman(c,{look:L,dir:d,moving:mv,walkPh:1.2,seed:1},0.3); c.restore(); }));
window.done=1;
</script>
