<!doctype html><body style="margin:0;background:#a3d68a"><canvas id=c></canvas><script type=module>
import '../js/systems/state.js';
import { drawHuman } from '../js/gfx/character.js';
import { RESIDENTS, MERCHANTS } from '../js/data/looks.js';
const ids=['chi_mai','co_hoa','chu_bay','anh_khoa','co_ba','chi_tien','co_bong','captain','co_lan','chu_hai'];
const Z=5, cv=document.getElementById('c'); cv.width=ids.length*40*Z; cv.height=2*54*Z; const c=cv.getContext('2d'); c.lineJoin='round'; c.lineCap='round';
ids.forEach((id,i)=>{ const L=(RESIDENTS[id]||MERCHANTS[id]).look; for (const [r,yw] of [[0,0.35],[1,Math.PI*0.8]]) { c.save(); c.setTransform(Z,0,0,Z,(i*40+20)*Z,(r*54+50)*Z); drawHuman(c,{look:L,dir:'down',yawOverride:yw,moving:0,seed:1},0.3); c.restore(); } });
window.done=1;
</script>
