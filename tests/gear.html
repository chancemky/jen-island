<!doctype html><body style="margin:0;background:#a3d68a"><canvas id=c></canvas><script type=module>
import '../js/systems/state.js';
import { drawHuman } from '../js/gfx/character.js';
import { playerLook } from '../js/data/looks.js';
import { CLOTHES, applyOutfit } from '../js/data/wardrobe.js';
const q=new URLSearchParams(location.search), Z=+(q.get('z')||4), N=8, mv=+(q.get('mv')||1);
const rows=[['guitar',{guitar:true}],['surf',{surf:'#6fbfb0'}],['tote',{tote:'#f7de8c'}],['backpack',{backpack:'#9fd8c8'}],['camera',{camera:true}],['bunny',null]];
const cv=document.getElementById('c'); cv.width=N*40*Z; cv.height=rows.length*54*Z; const c=cv.getContext('2d'); c.lineJoin='round'; c.lineCap='round';
const bunny=Object.keys(CLOTHES).find(k=>/bunny/.test(k));
rows.forEach(([nm,ex],r)=>{ for(let i=0;i<N;i++){ let L={...playerLook({hairStyle:'bob'}),...(ex||{})}; if(!ex&&bunny) L=applyOutfit(L,{[CLOTHES[bunny].slot]:bunny}); c.save(); c.setTransform(Z,0,0,Z,(i*40+20)*Z,(r*54+50)*Z); drawHuman(c,{look:L,dir:'down',yawOverride:i/N*Math.PI*2,moving:mv,moveAng:i/N*Math.PI*2,walkPh:1.2,seed:1},0.3); c.restore(); } });
window.done=1;
</script>
