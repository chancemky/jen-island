<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fbf3e4;font:800 11px sans-serif;color:#5b3f36}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script type="module">
// Clothes check: ?ids=a,b (default: every piece). Each piece on the player, from the front,
// both sides, three-quarter, the back, walking and with a different hairstyle.
import { drawHuman } from '../js/gfx/character.js';
import { playerLook } from '../js/data/looks.js';
import { CLOTHES } from '../js/data/wardrobe.js';
const ids = (new URLSearchParams(location.search).get('ids') || Object.keys(CLOTHES).join(',')).split(',');
const views = [['down', 0, 'bob'], ['right', 0, 'bob'], ['left', 0, 'long'], ['up', 0, 'bob'], ['down', 1, 'spiky'], ['right', 1, 'buns'], ['up', 1, 'long']];
const S = 2.2, CW = 70, RH = 130, W = 150 + views.length * CW, H = ids.length * RH + 10;
const cv = document.getElementById('c'); cv.width = W * 2; cv.height = H * 2; cv.style.width = W + 'px';
const c = cv.getContext('2d'); c.scale(2, 2); c.lineJoin = c.lineCap = 'round';
ids.forEach((id, r) => {
  const C = CLOTHES[id]; c.fillStyle = '#5b3f36'; c.font = '800 11px sans-serif'; c.fillText(id, 6, r * RH + 60);
  views.forEach(([dir, mv, hair], i) => {
    const look = { ...playerLook({ hairStyle: hair }), ...C.look };
    c.save(); c.translate(150 + i * CW + CW / 2, r * RH + 122); c.scale(S, S);
    drawHuman(c, { look, dir, moving: mv, walkPh: 1.1, seed: 1, blinkAmt: 0, emo: 'happy' }, 1.3); c.restore();
  });
});
window.__ready = true;
</script></body></html>
