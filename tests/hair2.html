<!doctype html><body style="margin:0;background:#a3d68a"><canvas id=c></canvas><script type=module>
import '../js/systems/state.js';
import { drawHuman } from '../js/gfx/character.js';
import { playerLook } from '../js/data/looks.js';
const q=new URLSearchParams(location.search), ids=(q.get('ids')||'bob,short,afro,curly,frenchbob,messy').split(','), dirs=['down','right','up'];
const Z=+(q.get('z')||6), cv=document.getElementById('c'); cv.width=dirs.length*ids.length*30*Z; cv.height=64*Z; const c=cv.getContext('2d'); c.lineJoin='round'; c.lineCap='round';
let i=0; for(const id of ids) for(const d of dirs){ const L=playerLook({hairStyle:id, hair:'#6e4430'}); L.hat=q.get('hat')||null; c.save(); c.setTransform(Z,0,0,Z,(i*30+15)*Z,58*Z); drawHuman(c,{look:L,dir:d,moving:0,seed:1},0.3); c.restore(); i++; }
window.done=1;
</script>
