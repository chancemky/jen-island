<!doctype html><body style="margin:0;background:#a3d68a"><canvas id=c></canvas><script type=module>
import '../js/systems/state.js';
import { drawHuman } from '../js/gfx/character.js';
import { playerLook } from '../js/data/looks.js';
const q=new URLSearchParams(location.search), Z=+(q.get('z')||6), hat=q.get('hat')||'cap', hs=(q.get('hs')||'short,bob').split(','), cv=document.getElementById('c'), N=8;
cv.width=N*40*Z; cv.height=hs.length*52*Z; const c=cv.getContext('2d'); c.lineJoin='round'; c.lineCap='round';
hs.forEach((h,r)=>{ for(let i=0;i<N;i++){ const L={...playerLook({hairStyle:h}),hat,hatColor:q.get('col')||'#e8584e'}; c.save(); c.setTransform(Z,0,0,Z,(i*40+20)*Z,(r*52+48)*Z); drawHuman(c,{look:L,dir:'down',yawOverride:i/N*Math.PI*2,moving:0,seed:1},0.3); c.restore(); } });
window.done=1;
</script>
