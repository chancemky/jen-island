<!doctype html><body style="margin:0;background:#a3d68a"><canvas id=c></canvas><script type=module>
import '../js/systems/state.js';
import { ANIMAL_DRAW } from '../js/systems/animals.js';
const Z=6, cv=document.getElementById('c'); cv.width=8*40*Z; cv.height=2*40*Z; const c=cv.getContext('2d'); c.lineJoin='round'; c.lineCap='round';
const cases=[['dog',{state:'walk',vx:20,vy:0,col:'#e8c08a'}],['dog',{state:'idle',idle:'sit',vx:0,vy:0,col:'#e8c08a'}],['dog',{state:'idle',idle:'wag',vx:0,vy:0,col:'#8a6a52'}],['dog',{state:'greet',vx:0,vy:0,col:'#fff4e0'}],
['cat',{state:'walk',vx:20,vy:0,col:'#f4a24a'}],['cat',{state:'idle',idle:'sit',vx:0,vy:0,col:'#f4a24a'}],['cat',{state:'idle',idle:'groom',vx:0,vy:0,col:'#555259'}],['goat',{state:'idle',vx:0,vy:0}],
['chicken',{state:'idle',idle:'peck',vx:0,vy:0,col:'#fffaf0',t:0.3}],['pigeon',{state:'idle',vx:0,vy:0}],['cat',{state:'idle',idle:'stretch',vx:0,vy:0,col:'#fff8ee',t:1.1}],['cat',{state:'idle',idle:'nap',vx:0,vy:0,col:'#b3a79a'}]];
cases.forEach(([k,o],i)=>{ c.save(); c.setTransform(Z*1.3,0,0,Z*1.3,((i%8)*40+20)*Z,(Math.floor(i/8)*40+32)*Z); ANIMAL_DRAW[k](c,0.5,{face:1,t:o.t??0.4,seed:1,...o}); c.restore(); });
window.done=1;
</script>
