<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>body{margin:0;background:#fbf3e4;font:800 12px Nunito,sans-serif;color:#5b3f36}.row{display:flex;gap:8px;align-items:end;padding:6px 10px;border-bottom:1px solid #ecd9bb}.row b{width:130px}canvas{background:#f3e3c8;border-radius:8px}.night canvas{background:#2e3550}</style></head><body>
<script type="module">
// Art check: ?ids=a,b (default: all). Each row: 4 moments in the room at 3x, the shop preview, and night.
import { FURN_DRAW, drawFurniturePreview } from '../js/gfx/furniture.js';
import { FURNITURE } from '../js/data/game.js';
const q = new URLSearchParams(location.search), ids = (q.get('ids') || Object.keys(FURNITURE).join(',')).split(',');
for (const id of ids) {
  const row = document.createElement('div'); row.className = 'row'; row.innerHTML = `<b>${id}</b>`; document.body.appendChild(row);
  for (const [t, night] of [[0.2, 0], [0.9, 0], [1.6, 0], [2.7, 0], [1.2, 1]]) {
    const cv = document.createElement('canvas'), S = 3; cv.width = 110 * S; cv.height = 110 * S; cv.style.width = '110px';
    if (night) cv.style.background = '#2e3550';
    const c = cv.getContext('2d'); c.lineJoin = c.lineCap = 'round'; c.scale(S, S); c.translate(55, 96);
    FURN_DRAW[id]?.(c, t, { x: 0, y: 0, ...FURNITURE[id] });
    row.appendChild(cv);
  }
  const pv = document.createElement('canvas'); pv.width = pv.height = 96; pv.style.width = '48px'; drawFurniturePreview(pv, id, FURNITURE[id]); row.appendChild(pv);
}
window.__ready = true;
</script></body></html>
